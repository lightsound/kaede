<!-- fallow-ignore-file coverage-gaps -- the Vite HTML entry: a page shell plus the script tag for main.tsx, with no module surface a test could import -->
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>kaede</title>
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
        background: #0b0d12;
        overscroll-behavior: none;
      }
      /* The canvas is appended by Pixi at runtime under #root. It fills the
         window: GameApp resizes the renderer to the window size (autoDensity
         writes the matching CSS size), so no width rule belongs here. */
      #root canvas {
        display: block;
        touch-action: none;
        user-select: none;
        -webkit-tap-highlight-color: transparent;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
