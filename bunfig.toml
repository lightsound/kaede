# Bun のパッケージマネージャ設定。旧 pnpm-workspace.yaml のサプライチェーン
# 保護を引き継ぐ（パッケージマネージャ移行の経緯は README「パッケージ
# マネージャ」参照）。
[install]
# 公開から 1 日未満のバージョンを解決しない（旧 minimumReleaseAge: 1440 分
# = 86400 秒）。侵害されたパッケージの多くは公開後数時間〜1日で撤回される
# ため、意図的なアップグレード PR が最大 1 日待つコストと引き換えに足切り
# する。
# 旧 minimumReleaseAgeStrict: true 相当は Bun の既定動作で、範囲内に足切り
# を通る版が無ければ黙って範囲外の版へ落とさずエラーになる（実測済み）。
# pnpm との差分: 足切りは新規解決時にのみ効き、bun.lock 記載済みの版は
# 再検証しない。
minimumReleaseAge = 86400
