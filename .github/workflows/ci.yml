name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the CLI so the bindings drift check doesn't break when a new release
  # changes codegen — module_bindings/index.ts records the CLI version, so any
  # bump must land together with a bindings regeneration commit.
  #
  # Kept on the same 2.7 line as the `spacetimedb` npm dependency. Note the tag
  # is not a plain vX.Y.Z: the newest 2.7 release is a hotfix tag, which is what
  # `releases/latest` resolves to.
  SPACETIME_VERSION: v2.7.0-hotfix3

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fallow health's churn/hotspot analysis walks git history, and the
          # default shallow clone empties it (fallow warns and carries on, so
          # this would degrade the report rather than fail the job).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check .

      - name: Import boundaries
        run: pnpm lint:imports --format github

      - name: Typecheck
        run: pnpm typecheck

      # Writes coverage/coverage-final.json, which `fallow health` reads for
      # real per-function CRAP scores (see .fallowrc.jsonc health.coverage).
      # Must run before the fallow steps below.
      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build client
        run: pnpm --filter @maple/client build

      - name: Dead-code check
        run: pnpm exec fallow dead-code

      - name: Duplicate check
        run: pnpm exec fallow dupes

      - name: Health check
        run: pnpm exec fallow health

      - name: Security candidates
        run: pnpm exec fallow security

      - name: Install SpacetimeDB CLI (pinned)
        uses: ./.github/actions/install-spacetimedb
        with:
          version: ${{ env.SPACETIME_VERSION }}

      - name: Check module bindings are up to date
        run: |
          spacetimedb-cli generate --lang typescript --module-path packages/server \
            --out-dir packages/client/src/module_bindings --yes
          if [ -n "$(git status --porcelain packages/client/src/module_bindings)" ]; then
            echo "::error::module_bindings drifted from the server schema. Run 'spacetime generate --lang typescript --module-path packages/server --out-dir packages/client/src/module_bindings' with CLI ${SPACETIME_VERSION} and commit the result."
            git diff packages/client/src/module_bindings
            exit 1
          fi

  # E2E smoke: boots the full stack (local SpacetimeDB host + Vite dev client)
  # and drives two guest browsers through the entry → movement-sync scenario
  # (packages/e2e). Runs in parallel with `ci`; the future auto-deploy job must
  # list BOTH jobs in `needs` so nothing ships without the smoke test passing
  # (docs/ROADMAP.md Phase 1, deploy flow).
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser binaries are heavy (~100MB); cache them keyed on the lockfile,
      # which pins the @playwright/test version and thus the browser build.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          # A partial hit still reports cache-hit != 'true', so the full
          # install path runs and re-saves — but skips browser builds that are
          # already present instead of re-downloading ~100MB per lockfile bump.
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @maple/e2e exec playwright install --with-deps chromium

      # On a cache hit only the OS packages are (re-)checked, not the browser.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @maple/e2e exec playwright install-deps chromium

      - name: Install SpacetimeDB CLI (pinned)
        uses: ./.github/actions/install-spacetimedb
        with:
          version: ${{ env.SPACETIME_VERSION }}

      - name: Start SpacetimeDB and publish the module
        run: |
          spacetimedb-cli start &> /tmp/spacetimedb.log &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/v1/ping > /dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              echo "::error::SpacetimeDB host did not come up on :3000 within 30s"
              cat /tmp/spacetimedb.log
              exit 1
            fi
            sleep 1
          done
          spacetimedb-cli publish maple-like --server local --yes

      - name: E2E smoke test
        run: pnpm test:e2e

      # Traces for the failed attempts are embedded in the HTML report; the
      # host log covers server-side failures (e.g. a rejected reducer call).
      # Copied into the report directory so the artifact root stays flat
      # (mixing absolute and relative upload paths roots the archive at /).
      - name: Collect failure artifacts
        if: failure()
        run: |
          mkdir -p packages/e2e/playwright-report
          cp /tmp/spacetimedb.log packages/e2e/playwright-report/spacetimedb.log || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: packages/e2e/playwright-report/
          retention-days: 14
