name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual escape hatch: re-run the full pipeline (checks + deploy) on any
  # ref, e.g. to re-deploy without an empty commit or to verify the deploy
  # job from a branch before merging.
  workflow_dispatch:

# Concurrency is declared per job, not per workflow. A workflow-level
# cancel-in-progress group would also cancel a deploy that is already
# publishing when the next merge lands, which can leave prod half-updated
# (e.g. module published but the old client still deployed). Instead:
#   - ci / e2e keep the old behavior (a new push cancels the outdated run)
#     via per-job groups keyed on the ref;
#   - deploy has its own never-cancel group so in-flight deploys always run
#     to completion and later ones queue behind them (see the job).

permissions:
  contents: read

env:
  # Pin the CLI so the bindings drift check doesn't break when a new release
  # changes codegen — module_bindings/index.ts records the CLI version, so any
  # bump must land together with a bindings regeneration commit.
  #
  # Kept on the same 2.7 line as the `spacetimedb` npm dependency. Note the tag
  # is not a plain vX.Y.Z: the newest 2.7 release is a hotfix tag, which is what
  # `releases/latest` resolves to.
  SPACETIME_VERSION: v2.7.0-hotfix3

jobs:
  ci:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # fallow health's churn/hotspot analysis walks git history, and the
          # default shallow clone empties it (fallow warns and carries on, so
          # this would degrade the report rather than fail the job).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check .

      - name: Import boundaries
        run: pnpm lint:imports --format github

      - name: Typecheck
        run: pnpm typecheck

      # Writes coverage/coverage-final.json, which `fallow health` reads for
      # real per-function CRAP scores (see .fallowrc.jsonc health.coverage).
      # Must run before the fallow steps below.
      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build client
        run: pnpm --filter @maple/client build

      - name: Dead-code check
        run: pnpm exec fallow dead-code

      - name: Duplicate check
        run: pnpm exec fallow dupes

      - name: Health check
        run: pnpm exec fallow health

      - name: Security candidates
        run: pnpm exec fallow security

      - name: Install SpacetimeDB CLI (pinned)
        uses: ./.github/actions/install-spacetimedb
        with:
          version: ${{ env.SPACETIME_VERSION }}

      - name: Check module bindings are up to date
        run: |
          spacetimedb-cli generate --lang typescript --module-path packages/server \
            --out-dir packages/client/src/module_bindings --yes
          if [ -n "$(git status --porcelain packages/client/src/module_bindings)" ]; then
            echo "::error::module_bindings drifted from the server schema. Run 'spacetime generate --lang typescript --module-path packages/server --out-dir packages/client/src/module_bindings' with CLI ${SPACETIME_VERSION} and commit the result."
            git diff packages/client/src/module_bindings
            exit 1
          fi

  # E2E smoke: boots the full stack (local SpacetimeDB host + Vite dev client)
  # and drives two guest browsers through the entry → movement-sync scenario
  # (packages/e2e). Runs in parallel with `ci`; the deploy job lists BOTH jobs
  # in `needs` so nothing ships without the smoke test passing
  # (docs/ROADMAP.md Phase 1, deploy flow).
  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    # Everything here is bounded (30s host wait, 120s per-test cap × 3
    # attempts), so a run that exceeds this is hung, not slow.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser binaries are heavy (~100MB); cache them keyed on the lockfile,
      # which pins the @playwright/test version and thus the browser build.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          # A partial hit still reports cache-hit != 'true', so the full
          # install path runs and re-saves — but skips browser builds that are
          # already present instead of re-downloading ~100MB per lockfile bump.
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @maple/e2e exec playwright install --with-deps chromium

      # On a cache hit only the OS packages are (re-)checked, not the browser.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @maple/e2e exec playwright install-deps chromium

      - name: Install SpacetimeDB CLI (pinned)
        uses: ./.github/actions/install-spacetimedb
        with:
          version: ${{ env.SPACETIME_VERSION }}

      - name: Start SpacetimeDB and publish the module
        run: |
          spacetimedb-cli start &> /tmp/spacetimedb.log &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/v1/ping > /dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              echo "::error::SpacetimeDB host did not come up on :3000 within 30s"
              cat /tmp/spacetimedb.log
              exit 1
            fi
            sleep 1
          done
          spacetimedb-cli publish maple-like --server local --yes

      - name: E2E smoke test
        run: pnpm test:e2e
        env:
          # guest-admission.spec.ts plays admin through `sql`; the pinned CLI
          # tarball ships the binary as spacetimedb-cli, not spacetime.
          SPACETIME_BIN: spacetimedb-cli

      # Traces for the retried attempts (trace: on-first-retry — the very
      # first attempt records none) are embedded in the HTML report; the
      # host log covers server-side failures (e.g. a rejected reducer call).
      # Copied into the report directory so the artifact root stays flat
      # (mixing absolute and relative upload paths roots the archive at /).
      - name: Collect failure artifacts
        if: failure()
        run: |
          mkdir -p packages/e2e/playwright-report
          cp /tmp/spacetimedb.log packages/e2e/playwright-report/spacetimedb.log || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: packages/e2e/playwright-report/
          retention-days: 14

  # Fully automated production deploy — no human gate (docs/ROADMAP.md
  # Phase 1, deploy flow). Every push to main that passes ci AND e2e deploys
  # both the SpacetimeDB module (Maincloud) and the client (Cloudflare
  # Workers via Alchemy). There is no change detection: deploying unchanged
  # code is effectively idempotent (Alchemy memoizes the build, re-publishing
  # an identical module is a no-op), and unconditional deploys keep the
  # pipeline simple and prod always equal to main. The safety net is
  # automated: an incompatible schema change makes `publish` itself fail and
  # stops the pipeline, and the bindings-drift check + E2E smoke run in the
  # jobs listed as `needs`.
  deploy:
    needs: [ci, e2e]
    # Deploys on push (which `on` restricts to main) and on manual dispatch.
    # A dispatch may target a branch — it deploys that ref as-is (used e.g.
    # for pre-merge verification of this job). PR runs never deploy.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    # The state-commit step pushes to the ref this run deployed.
    permissions:
      contents: write
    # Never cancel an in-flight deploy; serialize instead. Cancelling
    # mid-deploy could leave prod half-updated (module published, client
    # stale). The group is NOT keyed on the ref because every deploy targets
    # the same prod resources regardless of which ref triggered it. GitHub
    # keeps at most one pending run per group and cancels older pending ones,
    # which is fine: the newest queued deploy ships the newest code.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the state-commit step can rebase onto commits
          # that landed on this ref while the deploy was running.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install SpacetimeDB CLI (pinned)
        uses: ./.github/actions/install-spacetimedb
        with:
          version: ${{ env.SPACETIME_VERSION }}

      # Module first, client second: schema changes are compatible-only by
      # policy (ROADMAP Phase 1, migration rules), so old clients keep working
      # against the new schema, while a new client may need the new schema to
      # work at all. An incompatible change fails this publish and the client
      # never ships. TypeScript bindings are committed (drift-checked in `ci`)
      # and need no regeneration here.
      - name: Publish module to Maincloud
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
        run: |
          spacetimedb-cli login --token "$SPACETIMEDB_TOKEN"
          spacetimedb-cli publish maple-like --server maincloud --yes

      # Builds the client and converges the Cloudflare resources declared in
      # infra/alchemy.run.ts (see README「デプロイ(公開手順)」).
      - name: Deploy client (Alchemy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: CI=true pnpm --filter @maple/infra deploy:prod --yes

      # Alchemy keeps its state in files that are committed to git (README
      # 「Alchemy のステート管理」), and a deploy rewrites them, so push the
      # diff back to the ref that was deployed. Recursion is prevented by the
      # documented GitHub behavior that pushes made with the workflow's own
      # GITHUB_TOKEN do not trigger new workflow runs — this step relies on
      # that; if the checkout ever switches to a PAT or an app token, add an
      # explicit guard. The rebase keeps us on top of commits that landed
      # concurrently (deploys themselves are serialized by the concurrency
      # group, so two state commits can never race each other).
      - name: Commit Alchemy state
        run: |
          git add infra/.alchemy/state/kaede/prod
          if git diff --cached --quiet; then
            echo "Alchemy state unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deploy): Alchemy ステートを更新 (run ${GITHUB_RUN_ID})"
          # Rebase-then-push can still lose a race against a commit that lands
          # in between, so retry a few times before giving up.
          for attempt in 1 2 3; do
            git pull --rebase origin "$GITHUB_REF_NAME"
            if git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            echo "Push rejected (attempt ${attempt}); refetching and retrying."
          done
          echo "::error::Could not push the Alchemy state commit after 3 attempts."
          exit 1
