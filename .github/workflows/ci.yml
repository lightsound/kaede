name: CI

on:
  push:
    branches: [main]
  pull_request:

# One run per branch: a new push cancels the outdated run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pin the CLI so the bindings drift check doesn't break when a new release
  # changes codegen — the generated files carry the CLI version, so any bump
  # must land together with a bindings regeneration commit.
  #
  # Kept on the same 2.7 line as the `spacetimedb` npm dependency. Note the tag
  # is not a plain vX.Y.Z: the newest 2.7 release is a hotfix tag, which is what
  # `releases/latest` resolves to.
  SPACETIME_VERSION: v2.7.0-hotfix3

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # fallow health's churn/hotspot analysis walks git history; the
          # default shallow clone would silently reduce it to nothing.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      # Writes coverage/coverage-final.json, which `fallow health` reads for
      # real per-function CRAP scores (see .fallowrc.jsonc health.coverage).
      # Must run before the fallow steps below.
      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build client
        run: pnpm --filter @maple/client build

      - name: Dead-code check
        run: pnpm exec fallow dead-code

      - name: Duplicate check
        run: pnpm exec fallow dupes

      - name: Health check
        run: pnpm exec fallow health

      - name: Security candidates
        run: pnpm exec fallow security

      - name: Install SpacetimeDB CLI (pinned)
        run: |
          curl -sSfL -o /tmp/spacetime.tar.gz \
            "https://github.com/clockworklabs/SpacetimeDB/releases/download/${SPACETIME_VERSION}/spacetime-x86_64-unknown-linux-gnu.tar.gz"
          mkdir -p "$HOME/.local/bin"
          tar -xzf /tmp/spacetime.tar.gz -C "$HOME/.local/bin"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Check module bindings are up to date
        run: |
          spacetimedb-cli generate --lang typescript --module-path packages/server \
            --out-dir packages/client/src/module_bindings --yes
          if [ -n "$(git status --porcelain packages/client/src/module_bindings)" ]; then
            echo "::error::module_bindings drifted from the server schema. Run 'spacetime generate --lang typescript --module-path packages/server --out-dir packages/client/src/module_bindings' and commit the result."
            git diff packages/client/src/module_bindings
            exit 1
          fi
