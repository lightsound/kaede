name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Manual escape hatch: dispatching on main re-runs the full pipeline
  # (checks + deploy), e.g. to re-deploy without an empty commit. Dispatching
  # on any other ref runs the checks only (see the deploy job's `if`).
  workflow_dispatch:

# Concurrency is declared per job, not per workflow. A workflow-level
# cancel-in-progress group would also cancel a deploy that is already
# publishing when the next merge lands, which can leave prod half-updated
# (e.g. module published but the old client still deployed). Instead:
#   - ci / e2e keep the old behavior (a new push cancels the outdated run)
#     via per-job groups keyed on the ref;
#   - deploy has its own never-cancel group so in-flight deploys always run
#     to completion and later ones queue behind them (see the job).

permissions:
  contents: read

env:
  # Pin the CLI so the bindings drift check doesn't break when a new release
  # changes codegen — module_bindings/index.ts records the CLI version, so any
  # bump must land together with a bindings regeneration commit.
  #
  # Kept on the same version as the `spacetimedb` npm dependency (2.7.1), whose
  # update motivated this pin bump: the SDK's page-resume reconnect recovery
  # rides the same release line.
  SPACETIME_VERSION: v2.7.1

jobs:
  ci:
    runs-on: ubuntu-latest
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          # fallow health's churn/hotspot analysis walks git history, and the
          # default shallow clone empties it (fallow warns and carries on, so
          # this would degrade the report rather than fail the job).
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm exec biome check .

      - name: Import boundaries
        run: pnpm lint:imports --format github

      - name: Typecheck
        run: pnpm typecheck

      # Writes coverage/coverage-final.json, which `fallow health` reads for
      # real per-function CRAP scores (see .fallowrc.jsonc health.coverage).
      # Must run before the fallow steps below.
      - name: Test (with coverage)
        run: pnpm test:coverage

      - name: Build client
        run: pnpm --filter @kaede/client build

      - name: Dead-code check
        run: pnpm exec fallow dead-code

      - name: Duplicate check
        run: pnpm exec fallow dupes

      - name: Health check
        run: pnpm exec fallow health

      - name: Security candidates
        run: pnpm exec fallow security

      - name: Install SpacetimeDB CLI (pinned)
        uses: ./.github/actions/install-spacetimedb
        with:
          version: ${{ env.SPACETIME_VERSION }}

      - name: Check module bindings are up to date
        run: |
          spacetimedb-cli generate --lang typescript --module-path packages/server \
            --out-dir packages/client/src/module_bindings --yes
          if [ -n "$(git status --porcelain packages/client/src/module_bindings)" ]; then
            echo "::error::module_bindings drifted from the server schema. Run 'spacetime generate --lang typescript --module-path packages/server --out-dir packages/client/src/module_bindings' with CLI ${SPACETIME_VERSION} and commit the result."
            git diff packages/client/src/module_bindings
            exit 1
          fi

  # E2E smoke: boots the full stack (local SpacetimeDB host + Vite dev client)
  # and drives two guest browsers through the entry → movement-sync scenario
  # (packages/e2e). Runs in parallel with `ci`; the deploy job lists BOTH jobs
  # in `needs` so nothing ships without the smoke test passing
  # (docs/ROADMAP.md Phase 1, deploy flow).
  e2e:
    runs-on: ubuntu-latest
    concurrency:
      group: e2e-${{ github.ref }}
      cancel-in-progress: true
    # Everything here is bounded (30s host wait, 120s per-test cap × 3
    # attempts), so a run that exceeds this is hung, not slow.
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Browser binaries are heavy (~100MB); cache them keyed on the lockfile,
      # which pins the @playwright/test version and thus the browser build.
      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          # A partial hit still reports cache-hit != 'true', so the full
          # install path runs and re-saves — but skips browser builds that are
          # already present instead of re-downloading ~100MB per lockfile bump.
          restore-keys: playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm --filter @kaede/e2e exec playwright install --with-deps chromium

      # On a cache hit only the OS packages are (re-)checked, not the browser.
      - name: Install Playwright system dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: pnpm --filter @kaede/e2e exec playwright install-deps chromium

      - name: Install SpacetimeDB CLI (pinned)
        uses: ./.github/actions/install-spacetimedb
        with:
          version: ${{ env.SPACETIME_VERSION }}

      - name: Start SpacetimeDB and publish the module
        run: |
          spacetimedb-cli start &> /tmp/spacetimedb.log &
          for i in $(seq 1 30); do
            if curl -sf http://127.0.0.1:3000/v1/ping > /dev/null; then
              break
            fi
            if [ "$i" = 30 ]; then
              echo "::error::SpacetimeDB host did not come up on :3000 within 30s"
              cat /tmp/spacetimedb.log
              exit 1
            fi
            sleep 1
          done
          spacetimedb-cli publish kaede --server local --yes

      - name: E2E smoke test
        run: pnpm test:e2e
        env:
          # guest-admission.spec.ts plays admin through `sql`; the pinned CLI
          # tarball ships the binary as spacetimedb-cli, not spacetime.
          SPACETIME_BIN: spacetimedb-cli

      # Traces for the retried attempts (trace: on-first-retry — the very
      # first attempt records none) are embedded in the HTML report; the
      # host log covers server-side failures (e.g. a rejected reducer call).
      # Copied into the report directory so the artifact root stays flat
      # (mixing absolute and relative upload paths roots the archive at /).
      - name: Collect failure artifacts
        if: failure()
        run: |
          mkdir -p packages/e2e/playwright-report
          cp /tmp/spacetimedb.log packages/e2e/playwright-report/spacetimedb.log || true

      - name: Upload failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-failure-artifacts
          path: packages/e2e/playwright-report/
          retention-days: 14

  # Fully automated production deploy — no human gate (docs/ROADMAP.md
  # Phase 1, deploy flow). Every push to main that passes ci AND e2e deploys
  # both the SpacetimeDB module (Maincloud) and the client (Cloudflare
  # Workers via Alchemy). There is no change detection: deploying unchanged
  # code is effectively idempotent (Alchemy memoizes the build, re-publishing
  # an identical module is a no-op), and unconditional deploys keep the
  # pipeline simple and prod always equal to main. The safety net is
  # automated: an incompatible schema change makes `publish` itself fail and
  # stops the pipeline, and the bindings-drift check + E2E smoke run in the
  # jobs listed as `needs`.
  deploy:
    needs: [ci, e2e]
    # Only the main ref ever deploys: pushes are already restricted to main by
    # `on`, and a workflow_dispatch must be dispatched on main too. Dispatching
    # on another branch runs the checks but skips the deploy — otherwise the
    # dispatch escape hatch would let any ref reach prod with the deploy
    # secrets, bypassing review on main. PR runs (refs/pull/…) never match.
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    # The state-commit step pushes to the ref this run deployed.
    permissions:
      contents: write
    # Never cancel an in-flight deploy; serialize instead. Cancelling
    # mid-deploy could leave prod half-updated (module published, client
    # stale). The group is NOT keyed on the ref because every deploy targets
    # the same prod resources regardless of which ref triggered it. GitHub
    # keeps at most one pending run per group and cancels older pending ones,
    # which is fine: the newest queued deploy ships the newest code.
    concurrency:
      group: deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the state-commit step can rebase onto commits
          # that landed on this ref while the deploy was running.
          fetch-depth: 0

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install SpacetimeDB CLI (pinned)
        uses: ./.github/actions/install-spacetimedb
        with:
          version: ${{ env.SPACETIME_VERSION }}

      # Module first, client second: schema changes are compatible-only by
      # policy (ROADMAP Phase 1, migration rules), so old clients keep working
      # against the new schema, while a new client may need the new schema to
      # work at all. An incompatible change fails this publish and the client
      # never ships. TypeScript bindings are committed (drift-checked in `ci`)
      # and need no regeneration here.
      - name: Publish module to Maincloud
        env:
          SPACETIMEDB_TOKEN: ${{ secrets.SPACETIMEDB_TOKEN }}
        run: |
          spacetimedb-cli login --token "$SPACETIMEDB_TOKEN"
          spacetimedb-cli publish kaede --server maincloud --yes

      # Builds the client and converges the Cloudflare resources declared in
      # infra/alchemy.run.ts (see README「デプロイ(公開手順)」).
      #
      # VITE_CLERK_PUBLISHABLE_KEY is the PRODUCTION Clerk key (pk_live_)
      # baked into the client bundle (ClerkGate). Only this deploy job
      # provides it: local dev keeps the development instance's pk_test_ in
      # its own .env, and the two must never mix — the module's member-issuer
      # policy is keyed per database (gate ①, CONNECTION_POLICY in
      # packages/server), so a pk_test_ client deployed against production
      # would sign users in only for every connection to be refused.
      #
      # The POSTHOG_* variables reach the Vite build Alchemy spawns
      # (vite.config.ts reads them; see the initialization gate there):
      # - POSTHOG_ANALYTICS_API_KEY (phc_): the publishable project key baked
      #   into the production bundle. Only this deploy job provides it, so PR
      #   builds ship with telemetry compiled out.
      # - POSTHOG_API_KEY (phx_) + POSTHOG_PROJECT_ID: enable the sourcemap
      #   upload plugin (ADR §8.4). Deliberately ONLY here — uploading from
      #   PR builds would pollute the project's symbol sets.
      - name: Deploy client (Alchemy)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          VITE_CLERK_PUBLISHABLE_KEY: ${{ secrets.VITE_CLERK_PUBLISHABLE_KEY }}
          POSTHOG_ANALYTICS_API_KEY: ${{ secrets.POSTHOG_ANALYTICS_API_KEY }}
          POSTHOG_ANALYTICS_HOST: https://us.posthog.com
          POSTHOG_API_KEY: ${{ secrets.POSTHOG_API_KEY }}
          POSTHOG_PROJECT_ID: '540373'
        run: CI=true pnpm --filter @kaede/infra deploy:prod --yes

      # The call Worker's runtime secrets, synced out-of-band with wrangler
      # on every deploy. Deliberately NOT Alchemy bindings: Alchemy writes
      # Redacted values into its state files in PLAINTEXT, and the prod
      # state is committed to git (measured 2026-08-05 on a dev stage — see
      # the CallApi env comment in infra/alchemy.run.ts). Runs after the
      # Alchemy deploy so the Worker exists on the very first run;
      # Alchemy's later script uploads preserve out-of-band secret_text
      # bindings (also measured).
      #
      # - REALTIMEKIT_API_TOKEN: the Realtime-Admin account API token.
      # - R2_ACCESS_KEY_ID / R2_SECRET_ACCESS_KEY (増分④): the S3
      #   credentials the recording start hands the provider
      #   (storage_config) and presigned downloads are minted from. R2's
      #   S3 credentials ARE an R2-permitted API token in another form
      #   (access key = token id, secret = SHA-256 of the token value —
      #   live-verified 2026-08-06), so they are DERIVED here from the
      #   deploy token instead of adding GitHub secrets. Hardening path:
      #   swap in a bucket-scoped R2 token's pair, no code change. The
      #   preflight fails loudly if the deploy token lost its R2 grant.
      - name: Sync call Worker secrets (wrangler)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 751c8a59858c9c04a8e722df7330444d
          REALTIMEKIT_API_TOKEN: ${{ secrets.REALTIMEKIT_API_TOKEN }}
        run: |
          if [ -z "$REALTIMEKIT_API_TOKEN" ]; then
            echo "::error::REALTIMEKIT_API_TOKEN is not set (GitHub Actions secret). The call Worker cannot mint tokens without it."
            exit 1
          fi
          printf '%s' "$REALTIMEKIT_API_TOKEN" \
            | pnpm --filter @kaede/infra exec wrangler secret put REALTIMEKIT_API_TOKEN --name kaede-call
          r2_probe=$(curl -sS "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/r2/buckets" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}")
          if [ "$(printf '%s' "$r2_probe" | jq -r '.success')" != "true" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN has no R2 grant; recordings cannot upload or download. Add Workers R2 Storage read/write to the token (or point R2_* at a bucket-scoped token)."
            exit 1
          fi
          token_id=$(curl -sS "https://api.cloudflare.com/client/v4/user/tokens/verify" \
            -H "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" | jq -r '.result.id')
          printf '%s' "$token_id" \
            | pnpm --filter @kaede/infra exec wrangler secret put R2_ACCESS_KEY_ID --name kaede-call
          printf '%s' "$CLOUDFLARE_API_TOKEN" | sha256sum | cut -d' ' -f1 | tr -d '\n' \
            | pnpm --filter @kaede/infra exec wrangler secret put R2_SECRET_ACCESS_KEY --name kaede-call

      # Alchemy keeps its state in files that are committed to git (README
      # 「Alchemy のステート管理」), and a deploy rewrites them, so push the
      # diff back to the ref that was deployed. Recursion is prevented by the
      # documented GitHub behavior that pushes made with the workflow's own
      # GITHUB_TOKEN do not trigger new workflow runs — this step relies on
      # that; if the checkout ever switches to a PAT or an app token, add an
      # explicit guard. The rebase keeps us on top of commits that landed
      # concurrently (deploys themselves are serialized by the concurrency
      # group, so two state commits can never race each other).
      - name: Commit Alchemy state
        run: |
          git add infra/.alchemy/state/kaede/prod
          if git diff --cached --quiet; then
            echo "Alchemy state unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(deploy): Alchemy ステートを更新 (run ${GITHUB_RUN_ID})"
          # Rebase-then-push can still lose a race against a commit that lands
          # in between, so retry a few times before giving up. The rebase is
          # inside the retried condition (not a bare statement) so a transient
          # pull failure doesn't kill the step via errexit; a leftover
          # conflicted rebase is aborted before the next attempt.
          for attempt in 1 2 3; do
            if git pull --rebase origin "$GITHUB_REF_NAME" \
                && git push origin "HEAD:$GITHUB_REF_NAME"; then
              exit 0
            fi
            git rebase --abort 2>/dev/null || true
            echo "Pull or push failed (attempt ${attempt}); retrying."
            sleep 5
          done
          echo "::error::Could not push the Alchemy state commit after 3 attempts."
          exit 1
