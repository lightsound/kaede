packages:
  - packages/*
  - infra

# pnpm はビルドスクリプトを既定で無効化する。@posthog/cli の postinstall は
# ソースマップ用 CLI バイナリの取得で、許可しないと @posthog/rollup-plugin の
# アップロード(デプロイジョブ)が「バイナリなし」で落ちる。許可はこの1つ
# だけに絞る(他のスクリプトは無効のままでも動いている実績)。
# v11 で onlyBuiltDependencies から allowBuilds(true=許可 / false=明示拒否)へ
# 移行。false 行は「検討済みで不要」の記録を兼ねる。
allowBuilds:
  '@ffmpeg-installer/linux-x64': false
  '@posthog/cli': true
  # 以下は v10 時代から無効のままで動いている実績のある拒否(v11 の
  # strictDepBuilds は未判定のビルドスクリプトをエラーにするため明示する)。
  # esbuild/workerd はプリビルドバイナリを npm の optionalDependencies で
  # 取得する方式なので postinstall 不要。sharp / msgpackr-extract も同様。
  # core-js の postinstall は寄付告知のみ。
  core-js: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  sharp: false
  workerd: false

# サプライチェーン保護: 公開から 1 日未満のバージョンを解決しない(v11 既定値の
# 明示)。侵害されたパッケージの多くは公開後数時間〜1日で撤回されるため、
# 意図的なアップグレード PR が最大 1 日待つコストと引き換えに足切りする。
minimumReleaseAge: 1440
# strict = 範囲内に足切りを通るバージョンが無いとき、古いバージョンへ黙って
# 落とさずエラーにする(minimumReleaseAge を明示した時点で true が既定になるが、
# 暗黙にしない)。エージェント主導の更新では「頼んだバージョンより古いものが
# 静かに入る」方が事故のもとで、エラーなら対応(バージョン限定の除外 or 待つ)を
# 明示的に選べる — PR #75 の pullfrog 指摘を受けて明文化。
minimumReleaseAgeStrict: true
# 公開者の信頼が前の版より落ちたパッケージは入れない。minimumReleaseAge が
# 「公開直後」を足切りするのに対し、こちらは「かつて provenance か trusted
# publisher だったパッケージが、その証拠を落とした版」を拒む。比較は公開日の
# 前後であり semver ではない。失敗したら、まず回避できる版へ override する。
# どうしてもその版が要るときだけ trustPolicyExclude で明示的に通す。
trustPolicy: no-downgrade

# effect 4 のベータは beta.104 で Schema の API リネームがあり、alchemy
# 2.0.0-beta.70 は beta.103 までしか動かない(infra/package.json で effect と
# @effect/platform-node を beta.103 に固定済み)。ここでの override は、alchemy
# が範囲指定(>=beta.102)で引き込む残りの @effect/* が beta.105 に解決されて
# effect@beta.103 と peer 不整合のまま混在するのを防ぐ(pnpm は lockfile 確定後
# この不整合を警告しない — PR #71 の pullfrog 指摘)。@effect/sql-d1 と
# @effect/vitest は beta.102 のまま: rc.116 は effect rc を要求し、beta.103
# ピンと衝突する。@effect/vitest は peer に vitest ^3||^4 を要求するため
# vitest 5 との不整合が lockfile に残るが、ソースから未 import で実害は
# ない(認識済み)。alchemy を上げるときは infra 側のピンと一緒にこれらの
# override も見直すこと。
overrides:
  '@effect/platform-bun': 4.0.0-beta.103
  '@effect/platform-node-shared': 4.0.0-beta.103
  '@effect/sql-d1': 4.0.0-beta.102
  '@effect/sql-sqlite-do': 4.0.0-beta.103
  '@effect/vitest': 4.0.0-beta.102
  # @assetpack/core@1.7.0 が ^4 で 4.0.3 を引く。4.0.2 と 4.0.3 は provenance
  # なしで公開されていて trustPolicy が拒む。4.0.1 は 4 系で最後の provenance
  # 付き版で、4.0.2/4.0.3 の差分は型定義だけ。5 系は ESM 専用なので CJS の
  # assetpack には載せない。
  chokidar: 4.0.1
