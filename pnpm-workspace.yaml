packages:
  - packages/*
  - infra

# pnpm はビルドスクリプトを既定で無効化する。@posthog/cli の postinstall は
# ソースマップ用 CLI バイナリの取得で、許可しないと @posthog/rollup-plugin の
# アップロード(デプロイジョブ)が「バイナリなし」で落ちる。許可はこの1つ
# だけに絞る(他のスクリプトは無効のままでも動いている実績)。
# v11 で onlyBuiltDependencies から allowBuilds(true=許可 / false=明示拒否)へ
# 移行。false 行は「検討済みで不要」の記録を兼ねる。
allowBuilds:
  '@ffmpeg-installer/darwin-arm64': set this to true or false
  '@ffmpeg-installer/darwin-x64': set this to true or false
  '@ffmpeg-installer/linux-arm': set this to true or false
  '@ffmpeg-installer/linux-arm64': set this to true or false
  '@ffmpeg-installer/linux-ia32': set this to true or false
  '@ffmpeg-installer/linux-x64': false
  '@posthog/cli': true
  # 以下は v10 時代から無効のままで動いている実績のある拒否(v11 の
  # strictDepBuilds は未判定のビルドスクリプトをエラーにするため明示する)。
  # esbuild/workerd はプリビルドバイナリを npm の optionalDependencies で
  # 取得する方式なので postinstall 不要。sharp / msgpackr-extract も同様。
  # core-js の postinstall は寄付告知のみ。
  core-js: false
  cpu-features: false
  esbuild: false
  msgpackr-extract: false
  sharp: false
  workerd: false

# サプライチェーン保護: 公開から 1 日未満のバージョンを解決しない(v11 既定値の
# 明示)。侵害されたパッケージの多くは公開後数時間〜1日で撤回されるため、
# 意図的なアップグレード PR が最大 1 日待つコストと引き換えに足切りする。
minimumReleaseAge: 1440
# strict = 範囲内に足切りを通るバージョンが無いとき、古いバージョンへ黙って
# 落とさずエラーにする(minimumReleaseAge を明示した時点で true が既定になるが、
# 暗黙にしない)。エージェント主導の更新では「頼んだバージョンより古いものが
# 静かに入る」方が事故のもとで、エラーなら対応(バージョン限定の除外 or 待つ)を
# 明示的に選べる — PR #75 の pullfrog 指摘を受けて明文化。
minimumReleaseAgeStrict: true
# 公開者の信頼が前の版より落ちたパッケージは入れない。minimumReleaseAge が
# 「公開直後」を足切りするのに対し、こちらは「かつて provenance か trusted
# publisher だったパッケージが、その証拠を落とした版」を拒む。比較は公開日の
# 前後であり semver ではない。失敗したら、まず回避できる版へ override する。
# どうしてもその版が要るときだけ trustPolicyExclude で明示的に通す。
trustPolicy: no-downgrade

# pnpm 12 は packageManager ピンを解決して lockfile 先頭に env ドキュメント
# (packageManagerDependencies)として記録する。単一ドキュメント前提のツールは
# 先頭だけを読むため、fallow dead-code が「overrides 対象が lockfile に無い」と
# 誤判定し、GitHub dependency graph も依存 0 件になる(pnpm/pnpm#13805)。
# ignore でピンの解決・記録ごと止め、lockfile を単一ドキュメントに戻す。
# 実行 pnpm がピンを自動ダウンロードしなくなるだけで、packageManager フィールド
# 自体は corepack / pnpm/action-setup が読むので CI の版決定には影響しない。
pmOnFail: ignore

# alchemy は 2.0.0-beta.80 で effect 4.0.0 stable のモジュール構成に対応した
# (alchemy-run/alchemy#1894)。beta.84 で Cloudflare プロバイダが
# @alchemy.run/cloudflare に分離され(infra/package.json に直接依存として
# 追加)、alchemy / @alchemy.run/cloudflare の peer は effect も @effect/* も
# ^4.0.5 を要求する。@effect/* の各パッケージは peer に同じ版以上の
# effect(4.0.7 なら ^4.0.7)を要求する。kaede の effect 利用は alchemy 周辺
# (infra/alchemy.run.ts の effect/Effect のみ)なので、infra の
# effect / @effect/platform-node とこの override の effect 系は同じ版に
# 揃えて一緒に上げる。ここでの override は、alchemy 系が範囲指定で引き込む
# 残りの @effect/* が別版に解決されて peer 不整合のまま混在するのを防ぐ
# (pnpm は lockfile 確定後この不整合を警告しない — PR #71 の pullfrog 指摘)。
# @effect/vitest@4.0.7 の peer は vitest >=5 <6 で、vitest 5 と整合する。
# @effect/sql-sqlite-do は beta.84 のプロバイダ分割で依存元が消え、override が
# 空振りになったため外した(残すと fallow dead-code が unused override で落ちる)。
overrides:
  '@effect/platform-bun': 4.0.7
  '@effect/platform-node-shared': 4.0.7
  '@effect/sql-d1': 4.0.7
  '@effect/vitest': 4.0.7
  # @assetpack/core@1.7.0 が ^4 で 4.0.3 を引く。4.0.2 と 4.0.3 は provenance
  # なしで公開されていて trustPolicy が拒む。4.0.1 は 4 系で最後の provenance
  # 付き版で、4.0.2/4.0.3 の差分は型定義だけ。5 系は ESM 専用なので CJS の
  # assetpack には載せない。
  chokidar: 4.0.1
